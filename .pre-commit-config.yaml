repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim-trailing-whitespace
        entry: trailing-whitespace-fixer
        language: python
        additional_dependencies: [pre-commit-hooks>=4.4.0]
        types: [text]
        exclude: ^(?:.*\.parquet|reports/job_executions/)

      - id: end-of-file-fixer
        name: fix-end-of-files
        entry: end-of-file-fixer
        language: python
        additional_dependencies: [pre-commit-hooks>=4.4.0]
        types: [text]
        exclude: ^(?:.*\.parquet|reports/job_executions/)

      - id: check-yaml
        name: check-yaml
        entry: check-yaml
        language: python
        additional_dependencies: [pre-commit-hooks>=4.4.0]
        types: [yaml]

      - id: black
        name: black-formatter
        entry: black
        language: python
        additional_dependencies: [black>=23.3.0]
        types: [python]

      - id: flake8
        name: flake8-linter
        entry: flake8
        language: python
        additional_dependencies: [flake8>=6.0.0]
        types: [python]
